<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⛴️ 新渡輪船期極速查 (長洲 / 梅窩 / 中環)</title>
    <style>
        :root {
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --primary: #38BDF8;
            --primary-glow: rgba(56, 189, 248, 0.25);
            --accent-gold: #FBBF24;
            --accent-green: #10B981;
            --accent-orange: #F97316;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12), transparent 45%);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 頂部標題與時鐘 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left h2 {
            margin: 0;
            font-size: 21px;
            color: var(--primary);
            letter-spacing: 0.5px;
        }
        .header-left p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: var(--text-muted);
        }
        .live-clock {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-gold);
            font-variant-numeric: tabular-nums;
        }

        /* 三航線切換 Tabs */
        .route-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--border);
            gap: 4px;
        }
        .route-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            line-height: 1.3;
        }
        .route-tab.active {
            background: var(--primary);
            color: #0F172A;
            box-shadow: 0 2px 12px var(--primary-glow);
        }

        /* 方向與日子控制卡 */
        .control-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 14px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .direction-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .port-name {
            font-size: 17px;
            font-weight: 900;
            color: var(--text-main);
            flex: 1;
            text-align: center;
        }
        .swap-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--primary);
            width: 42px;
            height: 36px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .swap-btn:active { transform: rotate(180deg) scale(0.92); }

        .day-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 6px;
        }
        .day-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 9px 6px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .day-btn.active {
            background: rgba(251, 191, 36, 0.15);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* 下一班船實時倒數雷達卡 */
        .radar-card {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            border-radius: 20px;
            padding: 18px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .radar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .radar-badge {
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .next-main {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .next-time-big {
            font-size: 40px;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            font-variant-numeric: tabular-nums;
        }
        .countdown-box {
            text-align: right;
        }
        .countdown-label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
        }
        .countdown-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-gold);
            font-variant-numeric: tabular-nums;
        }

        .upcoming-row {
            display: flex;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
            align-items: center;
            flex-wrap: wrap;
        }
        .upcoming-label {
            font-size: 12px;
            color: var(--text-muted);
        }
        .upcoming-pill {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        /* 時段篩選與時間表網格 */
        .schedule-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid var(--border);
        }
        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 6px;
            flex-wrap: wrap;
        }
        .period-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .period-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .period-btn.active {
            background: var(--primary);
            color: #0F172A;
            border-color: var(--primary);
        }
        .toggle-past-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .time-cell {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            position: relative;
            transition: all 0.2s;
        }
        .time-cell.past {
            opacity: 0.35;
        }
        .time-cell.next-highlight {
            background: rgba(251, 191, 36, 0.18);
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.25);
            transform: scale(1.02);
        }
        .t-main {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }
        .t-sub {
            font-size: 10px;
            color: var(--text-muted);
        }
        .t-tag {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: bold;
        }
        .t-tag.sat-only {
            background: rgba(249, 115, 22, 0.2);
            color: #FB923C;
        }
        .t-tag.monfri-only {
            background: rgba(56, 189, 248, 0.2);
            color: #38BDF8;
        }
        .t-tag.pier5-tag {
            background: rgba(16, 185, 129, 0.2);
            color: #34D399;
        }
        .t-tag.next-tag {
            background: var(--accent-gold);
            color: #0F172A;
        }

        /* 船費與備註區 */
        .fare-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid var(--border);
        }
        .fare-title {
            font-size: 15px;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .fare-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .fare-table th, .fare-table td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .fare-table th {
            color: var(--text-muted);
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
        }
        .fare-table td:first-child {
            text-align: left;
            font-weight: bold;
            color: var(--text-main);
        }
        .fare-note {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部欄 -->
    <div class="header">
        <div class="header-left">
            <h2>⛴️ 新渡輪船期極速查</h2>
            <p id="effectiveNote">中環⇄長洲 (2026年4月1日起生效)</p>
        </div>
        <div class="live-clock" id="liveClock">--:--:--</div>
    </div>

    <!-- 航線切換 (三航線) -->
    <div class="route-tabs">
        <button class="route-tab active" id="tabRouteCC" onclick="switchRoute('CENTRAL_CC')">⛴️ 中環 ⇄ 長洲</button>
        <button class="route-tab" id="tabRouteCMW" onclick="switchRoute('CENTRAL_MW')">⛴️ 中環 ⇄ 梅窩</button>
        <button class="route-tab" id="tabRouteMW" onclick="switchRoute('CC_MUIWO')">🛥️ 長洲 ⇄ 梅窩<br><span style="font-size:10px; font-weight:normal;">(橫水渡)</span></button>
    </div>

    <!-- 方向與日子控制 -->
    <div class="control-card">
        <div class="direction-box">
            <div class="port-name" id="fromPortText">中環</div>
            <button class="swap-btn" onclick="swapDirection()" title="切換方向">⇄</button>
            <div class="port-name" id="toPortText">長洲</div>
        </div>

        <div class="day-selector">
            <button class="day-btn" id="dayBtnWeekday" onclick="setDayType('WEEKDAY')">星期一至五</button>
            <button class="day-btn" id="dayBtnSat" onclick="setDayType('SAT')">星期六</button>
            <button class="day-btn" id="dayBtnHoliday" onclick="setDayType('HOLIDAY')">星期日及公眾假期</button>
        </div>
    </div>

    <!-- 下一班船實時雷達 -->
    <div class="radar-card">
        <div class="radar-top">
            <span class="radar-badge">
                <span class="pulse-dot"></span>
                <span id="radarStatusText">下一班即將開出</span>
            </span>
            <span style="font-size:12px; color:var(--text-muted);" id="radarRouteLabel">由 中環 開出</span>
        </div>

        <div class="next-main">
            <div>
                <div class="next-time-big" id="nextSailTime">--:--</div>
                <div style="font-size:12px; color:var(--text-muted);" id="nextSailSub">--</div>
            </div>
            <div class="countdown-box">
                <span class="countdown-label">距離開船尚餘</span>
                <span class="countdown-val" id="nextCountdown">-- 分鐘</span>
            </div>
        </div>

        <div class="upcoming-row">
            <span class="upcoming-label">⏭️ 後續班次：</span>
            <div id="subsequentList" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
        </div>
    </div>

    <!-- 全日班次時間表 -->
    <div class="schedule-card">
        <div class="filter-row">
            <div class="period-tabs">
                <button class="period-btn active" onclick="setPeriod('ALL', this)">全部</button>
                <button class="period-btn" onclick="setPeriod('AM', this)">🌅 早上</button>
                <button class="period-btn" onclick="setPeriod('PM', this)">☀️ 下午</button>
                <button class="period-btn" onclick="setPeriod('NIGHT', this)">🌙 晚上</button>
            </div>
            <button class="toggle-past-btn" id="togglePastBtn" onclick="toggleShowPast()">👁️ 隱藏已過班次</button>
        </div>

        <div class="time-grid" id="timeGrid"></div>
    </div>

    <!-- 收費表 -->
    <div class="fare-card" id="fareSection"></div>
</div>

        return h * 60 + m;

            toPort = isReversed ? '中環 (6號碼頭)' : '梅窩';

            toPort = isReversed ? '長洲' : '梅窩';
        }
        document.getElementById('fromPortText').innerText = fromPort;

    function updateRadarAndHighlights() {
        const list = getActiveScheduleList();
        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        const nowSeconds = now.getSeconds();

        let nextIndex = list.findIndex(item => toMinutes(item) > nowMinutes);
        if (nextIndex === -1 && list.length > 0) {
            nextIndex = 0;
        }

        const nextItem = list[nextIndex];
        if (nextItem) {
            let diffMins = toMinutes(nextItem) - nowMinutes;
            if (diffMins <= 0) diffMins += 24 * 60;

            const remMins = diffMins - 1;
            const remSecs = 60 - nowSeconds;

            document.getElementById('nextSailTime').innerText = nextItem.t;
            document.getElementById('nextSailSub').innerText = `${nextItem.label}${nextItem.note ? ' · ' + nextItem.note : ''}`;

            if (remMins >= 60) {
                const hrs = Math.floor(remMins / 60);
                const mins = remMins % 60;
                document.getElementById('nextCountdown').innerText = `${hrs}小時 ${mins}分`;
            } else {
                document.getElementById('nextCountdown').innerText = `${remMins}分 ${String(remSecs).padStart(2, '0')}秒`;
            }
        }

        const subBox = document.getElementById('subsequentList');
        subBox.innerHTML = '';
        for (let i = 1; i <= 3; i++) {
            const idx = (nextIndex + i) % list.length;
            if (list[idx]) {
                const span = document.createElement('span');
                span.className = 'upcoming-pill';
                span.innerText = list[idx].t;
                subBox.appendChild(span);
            }
        }

        const grid = document.getElementById('timeGrid');
        grid.innerHTML = '';

        list.forEach((item, idx) => {
            const mins = toMinutes(item);
            const isPast = mins <= nowMinutes;
            const isNext = idx === nextIndex;

            if (hidePast && isPast && !isNext) return;

            const [h] = item.t.split(':').map(Number);
            if (currentPeriod === 'AM' && h >= 12 && !item.nextDayMidnight) return;
            if (currentPeriod === 'PM' && (h < 12 || h >= 18)) return;
            if (currentPeriod === 'NIGHT' && h < 18 && !item.nextDayMidnight) return;

            const cell = document.createElement('div');
            cell.className = `time-cell ${isPast ? 'past' : ''} ${isNext ? 'next-highlight' : ''}`;

            let tagHtml = '';
            if (isNext) {
                tagHtml = `<span class="t-tag next-tag">下一班</span>`;
            } else if (item.pier5) {
                tagHtml = `<span class="t-tag pier5-tag">○ 5號碼頭開</span>`;
            } else if (item.only === 'SAT') {
                tagHtml = `<span class="t-tag sat-only">只限週六</span>`;
            } else if (item.only === 'WEEKDAY') {
                tagHtml = `<span class="t-tag monfri-only">只限一至五</span>`;
            } else if (item.note) {
                tagHtml = `<span class="t-sub">${item.note}</span>`;
            }

            cell.innerHTML = `
                <span class="t-main">${item.t}</span>
                <span class="t-sub">${item.label}</span>
                ${tagHtml}
            `;
            grid.appendChild(cell);
        });
    }
